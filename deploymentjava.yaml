apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app

  labels:
    app: java-app

spec:

  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: java-app

  template:

    metadata:
      labels:
        app: java-app

    spec:

      containers:

        - name: java-app

          image: 931527443397.dkr.ecr.ap-south-1.amazonaws.com/javajenkins:latest

          imagePullPolicy: Always

          ports:

            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:

            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:

            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi
