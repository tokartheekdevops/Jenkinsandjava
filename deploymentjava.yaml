apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app
  namespace: shoprupee

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: java-app

  template:

    metadata:
      labels:
        app: java-app

    spec:

      imagePullSecrets:
        - name: ecr-registry-secret

      containers:

        - name: java-app

          image: 931527443397.dkr.ecr.ap-south-1.amazonaws.com/javajenkins:5

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
